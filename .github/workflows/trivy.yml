name: Trivy

# Escaneo de vulnerabilidades HIGH y CRITICAL (solo las que tienen fix). Falla el
# check si encuentra alguna. Corre en PRs, en cada push a main y a diario,
# porque aparecen CVEs nuevos en dependencias e imagenes que no cambiaron.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencias:
    name: Trivy (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Escanear dependencias
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.75.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
